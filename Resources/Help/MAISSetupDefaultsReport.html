<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>MAIS Setup Defaults</title>
		<link rel="stylesheet" href="ItemTemplateEditor.css?v=help-ui-20260421b" />
	</head>
	<body class="setup-page-body help-page-body--fullscreen">
		<section class="doc-page setup-page help-fullscreen-page">
			<header class="setup-header">
				<h1 id="setup-title">MAIS Setup Defaults</h1>
				<div id="setup-metrics" class="setup-chip-row ui-chip-row"></div>
				<div id="setup-context" class="setup-chip-row ui-chip-row"></div>
			</header>

			<section class="card setup-results">
				<div class="setup-table-scroll ui-scroll-y">
					<table class="setup-table">
						<colgroup>
							<col class="col-role" />
							<col class="col-class" />
							<col class="col-status" />
							<col class="col-details" />
						</colgroup>
						<thead>
							<tr>
								<th>Area</th>
								<th>Item</th>
								<th>Status</th>
								<th>Details</th>
							</tr>
						</thead>
						<tbody id="settings-results"></tbody>
						<tbody id="player-results"></tbody>
					</table>
				</div>
			</section>

			<section class="card setup-summary">
				<p id="setup-summary" class="setup-summary-message">
					Settings defaults and player Blueprint component setup report.
				</p>
			</section>

			<section class="card setup-actions">
				<div class="setup-action-row ui-action-row">
					<a class="setup-action ui-action" href="https://discord.gg/c2WQ658V44" data-type="external">Support Discord</a>
				</div>
			</section>
		</section>

		<script id="mais-setup-report-data" type="application/json">
			__MAIS_SETUP_REPORT_JSON__
		</script>
		<script src="ItemTemplateEditor.js?v=help-ui-20260421b"></script>
	</body>
</html>
